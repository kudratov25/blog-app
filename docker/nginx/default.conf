server {
    listen 80;
    server_name _;
    root /var/www/api/public;

    index index.php;
    charset utf-8;
    client_max_body_size 25M;

    # Docker internal DNS resolver so nginx starts even if nuxt container is still booting
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /favicon.ico { access_log off; log_not_found off; }

    # 1. Public uploaded media files (/storage/...) served directly by Nginx
    location ^~ /storage/ {
        try_files $uri $uri/ =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Backend API, Sanctum & Healthcheck routes -> Laravel PHP-FPM
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # 3. Everything else -> Nuxt 3 Frontend (enables single-domain or split-domain setups)
    location / {
        set $nuxt_upstream http://nuxt:3000;
        proxy_pass $nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
