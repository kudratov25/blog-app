services:

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./api:/var/www/api
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - blog

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/api
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${BACKEND_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,127.0.0.1:3000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-blog}
      - DB_USERNAME=${DB_USERNAME:-blog}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blog

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "sleep 10 && php artisan schedule:work"]
    volumes:
      - ./api:/var/www/api
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${BACKEND_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-blog}
      - DB_USERNAME=${DB_USERNAME:-blog}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=redis
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - php
    networks:
      - blog

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-blog}
      POSTGRES_USER: ${DB_USERNAME:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-blog}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blog

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - blog

  nuxt:
    build:
      context: ./web
      dockerfile: ../docker/nuxt/Dockerfile
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NUXT_API_BASE=${NUXT_API_BASE:-http://nginx/api/v1}
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-${BACKEND_URL:-http://localhost:8000}/api/v1}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - nginx
    networks:
      - blog

networks:
  blog:
    driver: bridge

volumes:
  postgres_data:
